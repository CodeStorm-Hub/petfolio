<script>
        const card = document.getElementById('petCard');
        let startX = 0;
        let currentX = 0;
        let isDragging = false;

        card.addEventListener('mousedown', startDrag);
        card.addEventListener('touchstart', startDrag);

        function startDrag(e) {
            isDragging = true;
            startX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
            card.classList.remove('transition-transform');
            
            document.addEventListener('mousemove', onDrag);
            document.addEventListener('touchmove', onDrag);
            document.addEventListener('mouseup', endDrag);
            document.addEventListener('touchend', endDrag);
        }

        function onDrag(e) {
            if (!isDragging) return;
            currentX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
            const diff = currentX - startX;
            const rotation = diff / 15;
            card.style.transform = `translateX(${diff}px) rotate(${rotation}deg)`;
        }

        function endDrag() {
            isDragging = false;
            card.classList.add('transition-transform');
            const diff = currentX - startX;
            
            if (Math.abs(diff) > 150) {
                const direction = diff > 0 ? 1000 : -1000;
                card.style.transform = `translateX(${direction}px) rotate(${direction / 15}deg)`;
                // In a real app, logic to load next card would go here
                setTimeout(() => {
                    card.style.transform = 'translateX(0) rotate(0)';
                }, 1000);
            } else {
                card.style.transform = 'translateX(0) rotate(0)';
            }

            document.removeEventListener('mousemove', onDrag);
            document.removeEventListener('touchmove', onDrag);
            document.removeEventListener('mouseup', endDrag);
            document.removeEventListener('touchend', endDrag);
        }
    </script>
