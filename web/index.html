<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">

  <!-- iOS PWA: safe area + no overscroll bounce -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <meta name="description"
        content="PetFolio — Your pet's social network, health tracker &amp; marketplace.">

  <!-- PWA theme -->
  <meta name="theme-color" content="#FF8A4C"
        media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1A1014"
        media="(prefers-color-scheme: dark)">

  <!-- iOS PWA meta -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PetFolio">

  <!-- iOS touch icons -->
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <title>PetFolio</title>
  <link rel="manifest" href="manifest.json">

  <!-- Stripe JS must load before Flutter -->
  <script src="https://js.stripe.com/v3/"></script>

  <style>
    /* Prevent flash of white during Flutter boot */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #FFF4E6;
      overscroll-behavior: none;
    }
    @media (prefers-color-scheme: dark) {
      html, body { background-color: #1A1014; }
    }
    /* iOS safe-area padding for standalone PWA */
    @supports (padding: env(safe-area-inset-bottom)) {
      body {
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
      }
    }
    /* Loading splash */
    #pwa-loading {
      position: fixed; inset: 0; z-index: 9998;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background-color: #FFF4E6;
      transition: opacity 0.4s ease;
    }
    #pwa-loading.hidden { opacity: 0; pointer-events: none; }
    @media (prefers-color-scheme: dark) {
      #pwa-loading { background-color: #1A1014; }
      #pwa-loading-text { color: #FFA374; }
    }
    #pwa-loading-logo {
      width: 96px; height: 96px;
      border-radius: 22px;
      box-shadow: 0 8px 32px rgba(255,138,76,.35);
      animation: pulse 1.8s ease-in-out infinite;
    }
    #pwa-loading-text {
      margin-top: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 22px; font-weight: 700;
      color: #FF8A4C; letter-spacing: -0.5px;
    }
    #pwa-loading-sub {
      margin-top: 6px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px; color: #A08070; letter-spacing: 0.2px;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1);   opacity: 1; }
      50%       { transform: scale(.94); opacity: .8; }
    }
  </style>
</head>
<body>
  <!-- PWA splash shown while Flutter initialises -->
  <div id="pwa-loading" aria-hidden="true">
    <img id="pwa-loading-logo" src="icons/Icon-192.png" alt="">
    <div id="pwa-loading-text">PetFolio</div>
    <div id="pwa-loading-sub">Your pet's world, beautifully organized.</div>
  </div>

  <script src="flutter_bootstrap.js" async></script>

  <script>
    // Hide the splash once Flutter's first frame is drawn
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('pwa-loading');
      if (el) {
        el.classList.add('hidden');
        setTimeout(function () { el.remove(); }, 450);
      }
    });
  </script>

  <!-- iOS PWA install banner — runs after body is ready -->
  <script src="pwa_banner.js" defer></script>
</body>
</html>
