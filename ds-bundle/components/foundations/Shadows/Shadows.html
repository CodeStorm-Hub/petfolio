<!-- @dsCard group="Foundations" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#FFF4E6;font-family:'Inter',sans-serif;padding:24px;display:flex;flex-direction:column;gap:20px}
  .sub{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:#957762;margin-bottom:12px}
  .row{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap}
  .card{background:#fff;border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:72px;border:1px solid #F4E2CB}
  .card__name{font-size:12px;font-weight:700;color:#957762}
  .card__desc{font-size:10px;color:#D6C2B0}
  .btn-demo{height:44px;padding:0 18px;border-radius:9999px;display:inline-flex;align-items:center;font-family:'Inter',sans-serif;font-size:14px;font-weight:700;border:none;color:#fff;background:#FF8A4C}
</style>
</head>
<body>
  <div>
    <div class="sub">Elevation levels</div>
    <div class="row">
      <div class="card" style="box-shadow:0 1px 2px rgba(38,19,8,.04)">
        <div class="card__name">e1</div>
        <div class="card__desc">Subtle lift</div>
      </div>
      <div class="card" style="box-shadow:0 4px 12px -2px rgba(38,19,8,.10)">
        <div class="card__name">e2</div>
        <div class="card__desc">Card elevated</div>
      </div>
      <div class="card" style="box-shadow:0 12px 28px -6px rgba(38,19,8,.14)">
        <div class="card__name">e3</div>
        <div class="card__desc">Sheet / modal</div>
      </div>
      <div class="card" style="box-shadow:0 20px 40px -8px rgba(38,19,8,.20)">
        <div class="card__name">e4</div>
        <div class="card__desc">Floating</div>
      </div>
    </div>
  </div>

  <div>
    <div class="sub">Button 3D shadow</div>
    <div class="row">
      <button class="btn-demo" style="box-shadow:0 6px 0 0 #E0651E,0 14px 20px -6px rgba(255,138,76,.59)">Primary</button>
      <button class="btn-demo" style="background:#2FCBA0;box-shadow:0 6px 0 0 #198C6E,0 14px 20px -6px rgba(47,203,160,.5)">Mint CTA</button>
      <button class="btn-demo" style="background:#A98BFF;box-shadow:0 6px 0 0 #6E4DDB,0 14px 20px -6px rgba(169,139,255,.5)">Match CTA</button>
    </div>
  </div>

  <div>
    <div class="sub">Glass shadow</div>
    <div style="background:linear-gradient(135deg,#FF8A4C,#A98BFF);border-radius:16px;padding:12px;position:relative;height:90px">
      <div style="position:absolute;bottom:10px;left:10px;right:10px;background:rgba(255,255,255,.62);backdrop-filter:blur(24px);border-radius:12px;border:1px solid rgba(255,255,255,.55);box-shadow:0 16px 40px -8px rgba(38,19,8,.18);padding:10px 14px">
        <div style="font-size:13px;font-weight:700;color:#261308">Glass shadow</div>
      </div>
    </div>
  </div>
</body>
</html>
