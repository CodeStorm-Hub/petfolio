<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600;700&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',sans-serif;padding:0;background:#1a1014}
  .scene{width:320px;height:220px;position:relative;border-radius:24px;overflow:hidden;margin:24px auto}
  .scene__bg{width:100%;height:100%;background:linear-gradient(135deg,#FF8A4C 0%,#A98BFF 60%,#2FCBA0 100%);position:absolute;inset:0}
  .scene__dots{position:absolute;inset:0;background-image:radial-gradient(circle,rgba(255,255,255,.18) 1px,transparent 1px);background-size:18px 18px}
  .glass{position:absolute;bottom:12px;left:12px;right:12px;background:rgba(255,255,255,.62);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-radius:16px;border:1px solid rgba(255,255,255,.55);box-shadow:0 16px 40px -8px rgba(38,19,8,.18);padding:14px 16px;overflow:hidden}
  .glass::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.08) 0%,transparent 30%);pointer-events:none}
  .glass__name{font-family:'Sora',sans-serif;font-size:17px;font-weight:700;color:#261308}
  .glass__sub{font-size:13px;color:#5E3A28;margin-top:2px}
  .glass__row{display:flex;gap:8px;margin-top:10px}
  .chip{background:rgba(255,255,255,.7);color:#E0651E;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600}
  .badge{background:rgba(47,203,160,.25);color:#198C6E;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600}
</style>
</head>
<body>
  <div class="scene">
    <div class="scene__bg"></div>
    <div class="scene__dots"></div>
    <div class="glass">
      <div class="glass__name">Biscuit 🐕</div>
      <div class="glass__sub">Golden Retriever · 3 yrs · Sydney</div>
      <div class="glass__row">
        <div class="chip">📍 2.4 km</div>
        <div class="badge">✓ Vaccinated</div>
      </div>
    </div>
  </div>
</body>
</html>
